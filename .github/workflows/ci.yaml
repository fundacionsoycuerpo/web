name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El CI corria solo e2e, y por eso el linter de componentes pudo estar
      # roto desde la migracion a Svelte 5 sin que nadie se enterara: fallaba
      # en los 26 .svelte y solo se veia corriendo `pnpm lint` a mano.
      #
      # check va primero porque es barato y detecta errores de tipos que el
      # build tolera. lint corre despues; hoy devuelve 54 warnings y 0 errores,
      # asi que no bloquea.
      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      # FLOW_URL alimenta la sección "Donación única online" dentro de un
      # {#if data.flow}: sin ella la sección no se renderiza y el test de
      # /donaciones falla. El valor es público (aparece en el HTML del sitio).
      - name: Run e2e tests
        run: pnpm run test:build:run
        env:
          FLOW_URL: 'https://www.flow.cl/btn.php?token=xx2flzy'

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
