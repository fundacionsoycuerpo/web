name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cypress necesita su binario. En pnpm 10+ los build scripts de
      # dependencias no se ejecutan salvo que estén en onlyBuiltDependencies,
      # así que se instala explícitamente.
      - name: Install Cypress binary
        run: pnpm exec cypress install

      # FLOW_URL alimenta la sección "Donación única online" dentro de un
      # {#if data.flow}: sin ella la sección no se renderiza y el test de
      # /donaciones falla. El valor es público (aparece en el HTML del sitio).
      - name: Run e2e tests
        run: pnpm run test:build:run
        env:
          FLOW_URL: 'https://www.flow.cl/btn.php?token=xx2flzy'

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
