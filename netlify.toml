# FLOW_URL es la única variable de entorno del sitio y hoy vive solo en el
# dashboard de Netlify, sin versionar. Eso tiene una consecuencia concreta:
# los Deploy Previews no la heredan, y desde #93 el build falla sin ella.
# Resultado: todo PR rompía su preview con "500 /donaciones".
#
# El token no es secreto. Aparece en el HTML público del sitio:
#   https://fundacionsoycuerpo.cl/donaciones -> flow.cl/btn.php?token=xx2flzy
# Si algún día cambia, se actualiza acá y en el dashboard.

[build.environment]
  FLOW_URL = "https://www.flow.cl/btn.php?token=xx2flzy"
